<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>사지방 군돌이</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;

            background: #f5f5f7;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Pretendard",
                "Noto Sans KR",
                sans-serif;

            color: #222;
        }

        .container {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
        }

        .card {
            background: #fff;

            border-radius: 24px;

            padding: 32px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 30px;

            font-size: 28px;
            font-weight: 800;
        }

        .date-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 16px;

            margin-bottom: 35px;
        }

        .date-box {
            padding: 18px;

            background: #f7f7f8;

            border-radius: 16px;
        }

        .date-box label {
            display: block;

            margin-bottom: 10px;

            color: #777;

            font-size: 14px;
            font-weight: 600;
        }

        .date-box input {
            width: 100%;

            border: none;
            outline: none;

            background: transparent;

            font-size: 17px;
            font-weight: 700;
            color: #222;
        }

        /* =========================
           퍼센트
        ========================= */

        .main-percent {
            text-align: center;

            margin: 25px 0 35px;
        }

        .percent {
            font-size: clamp(32px, 7vw, 52px);

            font-weight: 900;

            letter-spacing: -2px;

            font-variant-numeric: tabular-nums;

            white-space: nowrap;
        }

        .percent-label {
            margin-top: 8px;

            color: #888;

            font-size: 14px;
        }

        /* =========================
           그래프
        ========================= */

        .progress-wrapper {
            margin: 30px 0;
        }

        .progress-info {
            display: flex;

            justify-content: space-between;

            margin-bottom: 10px;

            font-size: 13px;

            color: #777;
        }

        .progress-bar {
            width: 100%;

            height: 22px;

            background: #e9e9ec;

            border-radius: 999px;

            overflow: hidden;
        }

        .progress {
            height: 100%;

            width: 0%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #111,
                    #555
                );

            /*
             * 너무 빠르게 움직이지 않도록
             * CSS transition은 사용하지 않음
             */
        }

        /* =========================
           통계
        ========================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 12px;

            margin-top: 30px;
        }

        .stat {
            padding: 20px 12px;

            text-align: center;

            background: #f7f7f8;

            border-radius: 16px;
        }

        .stat-title {
            margin-bottom: 8px;

            font-size: 13px;

            color: #888;
        }

        .stat-value {
            font-size: 22px;

            font-weight: 800;

            font-variant-numeric: tabular-nums;
        }

        /* =========================
           상세 정보
        ========================= */

        .detail {
            margin-top: 28px;

            padding-top: 24px;

            border-top: 1px solid #eee;
        }

        .detail-row {
            display: flex;

            justify-content: space-between;

            padding: 9px 0;

            font-size: 14px;
        }

        .detail-row span:first-child {
            color: #888;
        }

        .detail-row span:last-child {
            font-weight: 700;

            font-variant-numeric: tabular-nums;
        }

        /* =========================
           모바일
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .card {
                padding: 24px 18px;

                border-radius: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .date-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .percent {
                letter-spacing: -1.5px;
            }
        }
    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <h1>군돌이 짭 (feat. Chat GPT)</h1>


        <!-- 날짜 입력 -->

        <div class="date-grid">

            <div class="date-box">

                <label for="startDate">
                    입대일
                </label>

                <input
                    type="date"
                    id="startDate"
                    value="2026-06-23"
                >

            </div>


            <div class="date-box">

                <label for="endDate">
                    전역일
                </label>

                <input
                    type="date"
                    id="endDate"
                    value="2027-12-22"
                >

            </div>

        </div>


        <!-- 현재 복무율 -->

        <div class="main-percent">

            <div
                class="percent"
                id="percent"
            >
                0.00000000%
            </div>

            <div class="percent-label">
                현재 복무 진행률
            </div>

        </div>


        <!-- 가로 그래프 -->

        <div class="progress-wrapper">

            <div class="progress-bar">

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>

        </div>


        <!-- 통계 -->

        <div class="stats">

            <div class="stat">

                <div class="stat-title">
                    총 복무일
                </div>

                <div
                    class="stat-value"
                    id="totalDays"
                >
                    0일
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    복무한 날
                </div>

                <div
                    class="stat-value"
                    id="elapsedDays"
                >
                    0일
                </div>

            </div>


            <div class="stat">

                <div class="stat-title">
                    남은 날
                </div>

                <div
                    class="stat-value"
                    id="remainingDays"
                >
                    0일
                </div>

            </div>

        </div>


        <!-- 상세 정보 -->

        <div class="detail">

            <div class="detail-row">

                <span>
                    현재 시각
                </span>

                <span id="currentTime">
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>
                    입대일
                </span>

                <span id="startDisplay">
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>
                    전역일
                </span>

                <span id="endDisplay">
                    -
                </span>

            </div>


            <div class="detail-row">

                <span>
                    복무율
                </span>

                <span id="detailPercent">
                    -
                </span>

            </div>

        </div>

    </div>

</div>


<script>

    /* ================================
       DOM
    ================================= */

    const startDateInput =
        document.getElementById("startDate");

    const endDateInput =
        document.getElementById("endDate");

    const percentElement =
        document.getElementById("percent");

    const detailPercent =
        document.getElementById("detailPercent");

    const progressElement =
        document.getElementById("progress");

    const totalDaysElement =
        document.getElementById("totalDays");

    const elapsedDaysElement =
        document.getElementById("elapsedDays");

    const remainingDaysElement =
        document.getElementById("remainingDays");

    const elapsedText =
        document.getElementById("elapsedText");

    const remainingText =
        document.getElementById("remainingText");

    const currentTimeElement =
        document.getElementById("currentTime");

    const startDisplay =
        document.getElementById("startDisplay");

    const endDisplay =
        document.getElementById("endDisplay");


    /* ================================
       하루 = 밀리초
    ================================= */

    const DAY =
        24 * 60 * 60 * 1000;


    /* ================================
       날짜 생성
    ================================= */

    function getDateFromInput(value) {

        return new Date(
            value + "T00:00:00"
        );

    }


    /* ================================
       날짜 표시
    ================================= */

    function formatDate(date) {

        return date.toLocaleDateString(
            "ko-KR",
            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    }


    /* ================================
       시간 표시
    ================================= */

    function formatTime(date) {

        return date.toLocaleTimeString(
            "ko-KR",
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    }


    /* ================================
       메인 계산
    ================================= */

    function calculateService() {

        const start =
            getDateFromInput(
                startDateInput.value
            );

        const end =
            getDateFromInput(
                endDateInput.value
            );


        const now =
            new Date();


        /*
         * 잘못된 날짜
         */

        if (
            isNaN(start.getTime()) ||
            isNaN(end.getTime()) ||
            end <= start
        ) {

            percentElement.textContent =
                "날짜 오류";

            return;

        }


        /*
         * 전체 복무시간
         *
         * 밀리초 단위
         */

        const totalMilliseconds =
            end.getTime() -
            start.getTime();


        /*
         * 현재까지 복무한 시간
         *
         * 밀리초 단위
         */

        let elapsedMilliseconds =
            now.getTime() -
            start.getTime();


        /*
         * 입대 전
         */

        if (
            elapsedMilliseconds < 0
        ) {

            elapsedMilliseconds = 0;

        }


        /*
         * 전역 후
         */

        if (
            elapsedMilliseconds >
            totalMilliseconds
        ) {

            elapsedMilliseconds =
                totalMilliseconds;

        }


        /*
         * 남은 시간
         */

        const remainingMilliseconds =
            totalMilliseconds -
            elapsedMilliseconds;


        /*
         * 복무율 계산
         *
         * 100을 곱해서 %
         */

        let percent =
            (
                elapsedMilliseconds /
                totalMilliseconds
            ) * 100;


        /*
         * 0 ~ 100 제한
         */

        percent =
            Math.max(
                0,
                Math.min(
                    100,
                    percent
                )
            );


        /* ================================
           소수점 16자리
        ================================= */

        const percentText =
            percent.toFixed(8) + "%";


        percentElement.textContent =
            percentText;

        detailPercent.textContent =
            percentText;


        /* ================================
           그래프
        ================================= */

        progressElement.style.width =
            percent + "%";


        /* ================================
           일수
        ================================= */

        const totalDays =
            totalMilliseconds / DAY;

        const elapsedDays =
            elapsedMilliseconds / DAY;

        const remainingDays =
            remainingMilliseconds / DAY;


        totalDaysElement.textContent =
            totalDays.toFixed(2) + "일";

        elapsedDaysElement.textContent =
            elapsedDays.toFixed(6) + "일";

        remainingDaysElement.textContent =
            remainingDays.toFixed(6) + "일";


        elapsedText.textContent =
            elapsedDays.toFixed(6) + "일 복무";

        remainingText.textContent =
            remainingDays.toFixed(6) + "일 남음";


        /* ================================
           현재 시간
        ================================= */

        currentTimeElement.textContent =
            formatTime(now);


        /* ================================
           날짜
        ================================= */

        startDisplay.textContent =
            formatDate(start);

        endDisplay.textContent =
            formatDate(end);

    }


    /* ================================
       실시간 업데이트
    ================================= */

    function realtimeUpdate() {

        calculateService();

        requestAnimationFrame(
            realtimeUpdate
        );

    }


    /* ================================
       날짜 변경
    ================================= */

    startDateInput.addEventListener(
        "change",
        calculateService
    );

    endDateInput.addEventListener(
        "change",
        calculateService
    );


    /* ================================
       최초 실행
    ================================= */

    calculateService();


    /* ================================
       실시간 시작
    ================================= */

    requestAnimationFrame(
        realtimeUpdate
    );

</script>

</body>
</html>
